# Disable PipeWire's libcamera source: libspa-libcamera segfaults on the
# IMX208 (IPU3) camera whenever camera availability changes (feed toggle /
# app probing), and its crash-loop takes gnome-shell down with it.
# The physical camera is used via the gstreamer feed (libcamerasrc) instead;
# /dev/video0 (v4l2loopback) is a V4L2 device and unaffected.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}
