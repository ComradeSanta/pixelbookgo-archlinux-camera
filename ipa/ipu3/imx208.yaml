%YAML 1.1
---
version: 1
algorithms:
  - Af:
  - Agc:
      relativeLuminanceTarget: 0.35
      AeConstraintMode:
        ConstraintNormal:
          lower:
            qLo: 0.98
            qHi: 1.0
            yTarget: 0.5
      AeExposureMode:
        ExposureNormal:
          # Anti-flicker (50 Hz mains): pin exposure time at 10 ms — exactly
          # one full mains-flicker cycle (100 Hz intensity). Indoors the AGC
          # then only varies gain, so the picture stops pulsing.
          # For 60 Hz countries use 8333 us instead.
          exposureTime: [ 10000 ]
          gain: [ 8.0 ]
  - Awb:
  - BlackLevelCorrection:
  - ToneMapping:
...
